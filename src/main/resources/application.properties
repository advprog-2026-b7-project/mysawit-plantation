spring.application.name=mysawit-plantation

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/mysawit_plantation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Auth service integration
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8080}

# JWT verification
jwt.secret=${JWT_SECRET:dev-secret-key-dev-secret-key-123456}

# Inter-service API key (must match mysawit-delivery's inter.service.api-key)
inter.service.api-key=${INTER_SERVICE_API_KEY:mysawit-internal-secret-key-2024}
